<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="stadium">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>پیش‌بینی جام جهانی ۲۰۲۶</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script>
    (function(){ var t = localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme', t); })();
  </script>
</head>
<body>
  <div class="bg-orbs"><span></span><span></span><span></span></div>

  <div class="site-header" id="site-header">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo"><i class="bi bi-trophy-fill"></i></span>
        <div>
          <h1>پیش‌بینی جام جهانی</h1>
          <small>۲۰۲۶ • دوستانه</small>
        </div>
      </div>
      <div class="topbar-actions">
        <div class="menu-wrap">
          <button class="icon-btn" id="settings-btn" onclick="toggleMenu('settings')" aria-label="تنظیمات"><i class="bi bi-gear-fill"></i></button>
          <div class="popover popover-settings" id="menu-settings">
            <div class="popover-title">تم سایت</div>
            <div class="theme-switch" id="theme-switch"></div>
          </div>
        </div>
        <div class="menu-wrap" id="profile-wrap" style="display:none">
          <button class="icon-btn avatar-btn" id="profile-btn" onclick="toggleMenu('profile')" aria-label="پروفایل"><span class="chip-avatar" id="chip-avatar"></span></button>
          <div class="popover popover-profile" id="menu-profile">
            <div class="popover-user"><span class="chip-avatar chip-avatar-lg" id="chip-avatar-lg"></span><b id="who"></b></div>
            <button class="menu-item" onclick="switchTab('profile'); closeMenus()"><i class="bi bi-person-gear"></i> ویرایش پروفایل</button>
            <button class="menu-item danger" onclick="logout()"><i class="bi bi-box-arrow-right"></i> خروج</button>
          </div>
        </div>
      </div>
    </header>
    <nav class="tabs" id="main-tabs" style="display:none">
      <button class="tab active" data-tab="matches" onclick="switchTab('matches')"><i class="bi bi-bullseye"></i><span class="tab-label">بازی‌ها</span></button>
      <button class="tab" data-tab="tournament" onclick="switchTab('tournament')"><i class="bi bi-trophy"></i><span class="tab-label">قهرمانی</span></button>
      <button class="tab" data-tab="stats" onclick="switchTab('stats')"><i class="bi bi-bar-chart-fill"></i><span class="tab-label">آمار من</span></button>
      <button class="tab" data-tab="leaderboard" onclick="switchTab('leaderboard')"><i class="bi bi-list-ol"></i><span class="tab-label">جدول</span></button>
    </nav>
  </div>

  <main id="login-view" class="login-view">
    <!-- ورود -->
    <div class="card login-card" id="auth-login">
      <div class="login-emoji"><i class="bi bi-box-arrow-in-right"></i></div>
      <h2>ورود به مسابقه</h2>
      <p class="muted">نام کاربری و رمزت را وارد کن</p>
      <div class="field"><input id="username" placeholder="نام کاربری" autocomplete="username"></div>
      <div class="field"><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()"></div>
      <button class="btn-primary btn-block" onclick="login()">ورود</button>
      <p id="login-error" class="error-text"></p>
      <div class="auth-links"><a onclick="showAuth('register')">ثبت‌نام</a><span>·</span><a onclick="showAuth('forgot')">رمزت را فراموش کردی؟</a></div>
    </div>
    <!-- ثبت‌نام -->
    <div class="card login-card" id="auth-register" style="display:none">
      <div class="login-emoji"><i class="bi bi-person-plus-fill"></i></div>
      <h2>ثبت‌نام</h2>
      <p class="muted">یک حساب جدید بساز</p>
      <div class="field"><input id="reg-username" placeholder="نام کاربری" autocomplete="username"></div>
      <div class="field"><input id="reg-email" type="email" placeholder="ایمیل" autocomplete="email"></div>
      <div class="field"><input id="reg-password" type="password" placeholder="رمز عبور (حداقل ۴ کاراکتر)" autocomplete="new-password" onkeydown="if(event.key==='Enter')register()"></div>
      <button class="btn-primary btn-block" onclick="register()">ساختن حساب</button>
      <p id="reg-error" class="error-text"></p>
      <div class="auth-links"><a onclick="showAuth('login')">قبلاً ثبت‌نام کرده‌ام — ورود</a></div>
    </div>
    <!-- فراموشی رمز -->
    <div class="card login-card" id="auth-forgot" style="display:none">
      <div class="login-emoji"><i class="bi bi-key-fill"></i></div>
      <h2>بازیابی رمز عبور</h2>
      <p class="muted">ایمیلت را وارد کن تا رمز جدید برایت ارسال شود</p>
      <div class="field"><input id="forgot-email" type="email" placeholder="ایمیل" autocomplete="email" onkeydown="if(event.key==='Enter')forgot()"></div>
      <button class="btn-primary btn-block" onclick="forgot()">ارسال رمز جدید</button>
      <p id="forgot-msg" class="error-text"></p>
      <div class="auth-links"><a onclick="showAuth('login')">بازگشت به ورود</a></div>
    </div>
  </main>

  <main id="app-view" class="app-view" style="display:none">
    <section id="tab-matches" class="tab-panel">
      <div id="matches" class="matches-grid"></div>
    </section>

    <section id="tab-tournament" class="tab-panel" style="display:none">
      <div id="tournament"></div>
    </section>

    <section id="tab-stats" class="tab-panel" style="display:none">
      <div id="stats"></div>
    </section>

    <section id="tab-leaderboard" class="tab-panel" style="display:none">
      <div id="leaderboard"></div>
    </section>

    <section id="tab-profile" class="tab-panel" style="display:none">
      <div id="profile"></div>
    </section>
  </main>

  <button id="to-top" class="to-top" onclick="goTop()" aria-label="بالا"><i class="bi bi-arrow-up"></i></button>
  <div id="toast" class="toast"></div>

  <script src="app.js?v=7"></script>
</body>
</html>
